[package]
name = "tcs-shell"
version = "0.1.7"
description = "酒馆角色卡审计编辑工具链 · 桌面客户端壳（Tauri 2）"
authors = ["Tavern Card Studio"]
edition = "2021"
# Tauri 2 要求 1.77+；插件生态的 MSRV 随 tauri 走
rust-version = "1.77"

[lib]
name = "tcs_shell_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build-dependencies 有**独立的特性解析**，上面 [dependencies] 里的 indexmap 管不到它。
# tauri-build 会打开 schemars/preserve_order，所以这里必须再开一次 std，否则
# 编译 build script 时 schemars 仍报 E0107。详见 docs/11 §10.2。
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
# 核心
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 错误与摘要
thiserror = "2"
sha2 = "0.10"
# 插件（路线 B：官方插件 + 少量自定义命令）
#   dialog / fs / store / log / opener 会被前端 JS API 调用或有 Rust 侧初始化；
#   window-state / single-instance 纯 Rust 侧，不暴露给前端。
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

# ── 本地回环反向代理（v0.1.6 / T14.1）──────────────────────────
# 这四个包**本来就在依赖树里**（tauri → reqwest → hyper），这里只是显式声明
# 以便直接 `use` —— 不引入新的第三方代码，也不改 lock 里的版本。
#
# **只开 http1**：SillyTavern 是 HTTP/1.1，开 http2 纯粹是给可执行文件加体积。
# 需求给的体积红线是「客户端 +200 KB 内」，关掉 http2 是第一刀（决策 #224），
# 所以它不是"以后再说"的选项，而是默认就不开。
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# T15.4 ST 的 HTTP 层。注意**必须放 [dependencies]**：
# 第一版我插到了 [build-dependencies] 段（`indexmap` 那行上面），
# 于是 lib 编译时 `reqwest` 根本不在作用域，报了一堆 "unresolved module"。
#
# cookie_store 是这套方案的**前提**：cookie 由 Rust 侧 jar 持有并自动附着，
# 不经过浏览器同源策略 —— 这正是绕开 "SameSite=Lax 在跨站 iframe 里不发送"
# 那条坑的办法（memory §20）。
#
# 关掉默认特性再只开需要的：默认带 native-tls / system-proxy 等，
# 而这里只访问 127.0.0.1、ST 走 http，不需要 TLS。
# `stream` 是 T15.5 加的：聊天生成要逐块读 SSE（`bytes_stream()`）。
# 不加这个 feature 的话 `Response::bytes_stream` 根本不存在，
# 而退化成 `response.text()` 会等生成全部结束才返回 —— 打字机效果就没了。
# `rustls-tls` 试过但**撤掉**了（2026-11-04）：它依赖 `ring`，而 ring 需要
# 用 NDK 的 clang 编译 C 代码，在这套交叉编译环境里直接失败
# （`failed to run custom build command for ring`）。
#
# 所以仓库的 HTTPS 走 **Android 原生 HttpURLConnection**（见 StBridge.httpRequest）：
# 用系统证书链，比自带一份 TLS 栈更正确，也不用编译 C。
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "stream"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros"] }
# 代理的失败要能落到 client-error.log 同级（tauri-plugin-log 已注册）
log = "0.4"

# ── 仅用于特性合并，代码里不使用 ──────────────────────────────
# indexmap 1.9.x 的 [features] 里没有 `default = ["std"]`（上游疏漏），
# 而 tauri-build / tauri-plugin 会打开 `schemars/preserve_order`，
# 该路径下 schemars 写的是 `IndexMap<K, V>`（两参数），只有在 std 特性开启时
# `IndexMap<K, V, S = RandomState>` 才有默认参数；否则报
#   error[E0107]: struct takes 3 generic arguments but 2 generic arguments were supplied
# 这里不引入任何代码依赖，只借 Cargo 的同版本特性合并把 std 打开。
# 详见 docs/11 §10.2。删除后必然编译失败。
indexmap = { version = "1.9", features = ["std"] }

[features]
# 供 CI 显式开关（默认跟随 tauri 的 custom-protocol 约定）
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 体积优先：本项目壳代码量小，LTO 与 strip 的构建代价可接受
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
