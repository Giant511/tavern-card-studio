# 判定包不需要大堆优化；给足内存避免 AGP 在 94.9 MB 的 .so 上 OOM。
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=false

# ── 中文路径（2026-10-30 实测必须加）────────────────────────────
#
# 本仓库路径是 D://Claw//代码开发//...，含非 ASCII 字符。AGP 8.x 会**直接拒绝构建**：
#
#   Your project path contains non-ASCII characters. This will most likely cause
#   the build to fail on Windows. Please move your project to a different directory.
#
# 这个检查默认是"硬失败"而不是警告，说明 Google 认为风险真实存在
# （主要是 NDK / CMake 把路径拼进 shell 命令时会炸）。
#
# 本项目**不用 NDK、不用 CMake**：app 模块是纯 Java + 一个预编译的 libnode.so，
# 没有 native 构建步骤。所以这里关掉检查是可行的 —— 但这是**基于"无 native 构建"
# 这个前提**的判断，不是"这个检查没用"。
#
# 前提变了就要回来重看：一旦 T15.3 引入 NDK/CMake（比如自己编译 JNI 桥），
# 这行必须删掉并把源码挪到纯 ASCII 路径。
android.overridePathCheck=true
